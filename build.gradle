plugins {
    id 'java'
    id 'org.springframework.boot'        version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group   = 'com.teamfighter'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    // 웹 + 서버 렌더링 (D22: Thymeleaf + HTMX, 별도 SPA 없음)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 적재는 JPA, 집계는 JdbcTemplate (D22). starter-data-jpa 가 jdbc 도 끌어온다
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Flyway. 두 가지가 따로 필요하다:
    //  - flyway-database-postgresql : Flyway 10+ 는 DB 별 모듈이 분리돼 있다
    //  - spring-boot-starter-flyway : Boot 4 는 자동설정을 기술별 모듈로 쪼갰다.
    //    Boot 3 처럼 flyway-core 만 넣으면 마이그레이션이 조용히 안 돈다 (D31)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
    // Testcontainers 는 쓰지 않는다 (D23: 이 PC 에서 Docker 가 기동되지 않음).
    // 테스트는 로컬 tfm_test DB + 트랜잭션 롤백으로 격리한다.
}

tasks.named('test') {
    useJUnitPlatform()
    // 골든 파일 비교가 CRLF 에 깨지지 않게 (D27)
    systemProperty 'file.encoding', 'UTF-8'
}
