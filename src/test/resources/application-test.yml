# 테스트는 별도 DB 를 쓴다. Testcontainers 를 쓰지 않는 이유는 D23 참고
# (이 PC 에서 Docker 가 기동되지 않는다).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tfm_test
    username: ${TFM_DB_USER:postgres}
    password: ${TFM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate    # 엔티티 매핑이 실제 스키마와 어긋나면 여기서 죽는다
    open-in-view: false
    properties:
      hibernate.generate_statistics: ${TFM_SQL_STATS:false}
      # 운영과 같은 조건에서 재야 측정이 의미가 있다
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
logging:
  level:
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
    # TFM_SQL_STATS=true 로 켜면 적재 한 번에 나가는 SQL 수가 찍힌다.
    # 추측 대신 세기 위한 것이다 — 기본은 꺼둔다
    org.hibernate.stat: ${TFM_SQL_STATS_LOG:WARN}

tfm:
  # 통합 테스트에서는 워처를 띄우지 않는다. 띄우면 @SpringBootTest 컨텍스트가
  # 세이브 폴더(%USERPROFILE%\AppData\LocalLow\...)의 존재에 묶이고, 그 폴더가 없는
  # 환경에서는 DB 매핑 테스트가 DB 와 상관없는 이유로 죽는다.
  # 워처 자체의 계약은 ingest/watcher/ 아래 단위 테스트가 컨텍스트 없이 검증한다.
  watch-enabled: false
