spring:
  application:
    name: tfm

  datasource:
    url: jdbc:postgresql://localhost:5432/${TFM_DB_NAME:tfm}
    username: ${TFM_DB_USER:postgres}
    # 비밀번호를 파일에 적지 않는다. 환경변수로 넣는다.
    # PowerShell 은 따옴표가 없으면 값을 명령어로 해석한다. 반드시 따옴표를 쓸 것:
    #   $env:TFM_DB_PASSWORD = 'your-password'
    password: ${TFM_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마의 주인은 Flyway 다. Hibernate 가 손대지 않는다
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # 적재는 한 파일에 수천 행을 넣는다. 배치가 없으면 행마다 왕복한다.
      # MatchRecord·Patch 는 IDENTITY 라 어차피 배치가 안 걸리지만
      # (Hibernate 가 생성된 키를 즉시 받아야 한다),
      # 참가자·밴은 자연키라 배치된다 — 그쪽이 행 수의 대부분이다
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  thymeleaf:
    cache: false            # 로컬 실행 전제라 템플릿을 즉시 반영한다

server:
  # 8080 은 로컬 LLM 서버(llama-server)가 쓰고 있다
  port: ${TFM_PORT:8088}
  # 루프백에만 바인딩한다 (D59). 인증이 없으므로 (D41: 로컬 단일 사용자라 인증할
  # 상대가 없다) 기본값 0.0.0.0 으로 두면 같은 네트워크의 누구나 열어볼 수 있다.
  # "인증할 상대가 없다" 는 전제를 실제로 참으로 만드는 한 줄이다.
  # 다른 기기에서 봐야 하면 TFM_BIND=0.0.0.0 으로 켠다 — 그때는 노출을 아는 상태다.
  address: ${TFM_BIND:127.0.0.1}

tfm:
  # 워처가 감시할 세이브 폴더. slot_*.tfm 만 잡는다 (D28: *.tfm_backup 제외)
  save-dir: ${TFM_SAVE_DIR:${user.home}/AppData/LocalLow/samoyed/Teamfight Manager}
  # 세이브 쓰기 감지 후 이만큼 기다렸다 읽는다. 쓰는 도중에 읽으면 스트림이 잘린다 (D12)
  watch-debounce-ms: 1500
  # 워처를 띄울지. 운영에서는 켠다 — 끄는 곳은 통합 테스트뿐이다
  watch-enabled: true
  # 세이브 파일은 읽기만 한다. 어떤 경우에도 쓰지 않는다.
  read-only: true
  # 기동 시 카운터 집계를 한 번 돌린다. 기본은 꺼짐 — 언제 돌릴지가 아직 결정되지 않았고,
  # 정해지지 않은 것을 기본값으로 굳히지 않는다. 실제 데이터로 한 번 돌려볼 때만 켠다:
  #   gradlew.bat bootRun --args="--tfm.aggregate-on-start=true"
  # TfmProperties 에는 필드가 없다 — @ConditionalOnProperty 가 환경에서 직접 읽는다.
  aggregate-on-start: false

logging:
  level:
    com.teamfighter.tfm: DEBUG
    org.flywaydb: INFO
