<!DOCTYPE html>
<!--
  갤러리 — 기사 하나에 달린 게시판.

  레퍼런스 모드의 화면을 그대로 옮긴 것이다: 개념글이 위로 올라가고, 제목 옆에
  댓글 수가 빨갛게 붙고, 유동닉·조회수·추천수가 오른쪽에 늘어선다.

  글을 여는 데 자바스크립트를 쓰지 않는다. <details>/<summary> 가 브라우저 기본으로
  접었다 폈다 하므로, 모달을 만들면 붙어야 할 것(열기·닫기·바깥 클릭·뒤로가기)을
  전부 안 만들어도 된다. 대신 목록과 본문이 한 화면에 있어서 위아래로만 움직인다.

  조회수·추천수는 모델이 지어낸 값이다 (D71). 이 화면 밖으로 나가지 않는다 —
  숫자에 링크를 걸지 않는 것은 기사 화면과 같은 규칙이다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.headline} + ' — 갤러리'">갤러리</title>
    <link rel="stylesheet" th:href="@{/css/tfm.css}">
</head>
<body>
<header class="top">
    <a class="back" th:href="@{'/story/' + ${article.articleId}}">← 기사</a>
</header>

<main>
    <!--
      게시판 머리. 갤러가 무엇을 읽고 이 글들을 썼는지 한 줄로 보인다 —
      모드에서 [이슈] 자리에 있던 것이 우리는 대조까지 끝난 기사다.
    -->
    <section class="gallery-head">
        <h1>
            <span th:text="${article.blueTeamName} ?: ('팀 ' + ${article.blueTeamId})">블루</span>
            <b th:text="${article.blueScore} + ' - ' + ${article.redScore}">스코어</b>
            <span th:text="${article.redTeamName} ?: ('팀 ' + ${article.redTeamId})">레드</span>
            갤러리
        </h1>
        <p class="meta">
            <span th:text="'시즌 ' + ${article.season} + ' · ' + ${article.day} + '일'">시점</span>
            · 글 <b th:text="${gallery.posts.size()}">0</b>편
            · <a th:href="@{'/story/' + ${article.articleId}}" th:text="${article.headline}">기사</a>
        </p>
    </section>

    <!--
      목록. gallery.ordered() 가 개념글을 위로 올린다 — 그 정렬 규칙을 템플릿이 아니라
      자바에 둔 이유는 화면마다 다시 쓰면 두 화면이 다른 순서를 그리기 때문이다.
    -->
    <section class="board">
        <ol class="posts">
            <li th:each="post : ${gallery.ordered()}"
                th:classappend="${post.isConcept()} ? 'concept' : ''">
                <details>
                    <summary>
                        <span class="num" th:text="${post.isConcept()} ? '개념' : ${post.ordinal}">번호</span>
                        <span class="kind" th:text="${post.kind.label()}">유형</span>
                        <span class="title" th:text="${post.title}">제목</span>
                        <b class="cmt" th:if="${post.commentCount() > 0}"
                           th:text="'[' + ${post.commentCount()} + ']'">[0]</b>
                        <span class="who" th:text="${post.author} ?: 'ㅇㅇ'">닉</span>
                        <!--
                          모델이 조회수를 안 준 글이 있다. 그때 0 을 그리면 "아무도 안 봤다"
                          로 읽히므로 칸을 비운다 — 없는 값과 0 은 다른 뜻이다 (D71).
                        -->
                        <span class="num-cell" th:text="${post.views} ?: '-'">조회</span>
                        <span class="num-cell" th:text="${post.likes} ?: '-'">추천</span>
                    </summary>

                    <div class="post-body">
                        <!-- 짤방은 파일명만 나온다. 실제 이미지는 없다 (모드도 같다). -->
                        <p class="image-desc" th:if="${post.hasImage()}"
                           th:text="'📎 ' + ${post.imageDesc}">짤방.jpg</p>

                        <div class="body" th:text="${post.body}">본문</div>

                        <ul class="thread" th:if="${post.commentCount() > 0}">
                            <!--
                              th:with 를 <li> 에 두는 이유: th:if(300)가 th:with(500)보다
                              먼저 평가되므로 둘을 같은 태그에 두면 아직 없는 변수를 읽고
                              템플릿 파싱 단계에서 죽는다 — 기사 화면에서 실제로 그렇게 깼다.

                              iterStat 은 th:each 가 주는 반복 정보다. index 는 0부터이고,
                              repliesTo 가 그것을 원댓글 순번(1부터)으로 바꾼다.
                            -->
                            <li th:each="comment, iter : ${post.roots()}"
                                th:with="replies=${post.repliesTo(iter.index)}">
                                <span class="who" th:text="${comment.author} ?: 'ㅇㅇ'">닉</span>
                                <span th:text="${comment.body}">댓글</span>

                                <ul class="replies" th:if="${!replies.isEmpty()}">
                                    <li th:each="reply : ${replies}">
                                        <span class="who" th:text="${reply.author} ?: 'ㅇㅇ'">닉</span>
                                        <span th:text="${reply.body}">대댓글</span>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </details>
            </li>
        </ol>
    </section>

    <footer class="origin">
        <span th:text="${gallery.model}">모델</span>
        ·
        <span th:text="${#temporals.format(gallery.generatedAt, 'yyyy-MM-dd HH:mm')}">생성 시각</span>
        ·
        <span th:text="'호출 ' + ${gallery.chunks} + '회'">조각</span>
    </footer>

    <p class="note">
        <b>이 화면의 글·댓글·조회수·추천수는 전부 지어낸 것이다.</b>
        경기 결과와 선수 기록만 세이브에서 왔다 — 그 대조는
        <a th:href="@{'/story/' + ${article.articleId}}">기사 화면</a>의
        「이 기사가 쓴 숫자」에 있다.
    </p>
</main>
</body>
</html>
