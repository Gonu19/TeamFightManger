<!DOCTYPE html>
<!--
  갤러리 — 레퍼런스 모드(TFA2_gallery.html)의 화면을 그대로 옮겼다.

  글을 누르면 목록이 사라지고 그 자리에 본문이 뜬다(모드의 post-view). 모달이 아니라
  자리를 바꾸는 이유는 모드가 그렇고, 그래야 뒤로가기·스크롤이 자연스럽기 때문이다.

  모드에는 오른쪽에 [🔥 팀파 이슈] 사이드바가 더 있다. 하루 만들어 보고 뺐다 (D74) —
  호출 하나를 통째로 더 쓰는데 분당 토큰 한도 안에서 그게 페이지 뜨는 시간을 배로 늘렸다.

  데이터는 아래 <script type="application/json"> 에 통째로 실려 온다. 정렬(최신·조회·추천)과
  글 열기는 전부 브라우저가 한다 — 글 스무 개짜리 목록에서 정렬 버튼마다 서버를 왕복하는
  것은 순전히 손해다. 반면 페이지 넘기기는 서버가 한다. 그건 다른 데이터이기 때문이다.

  조회수·추천수는 지어낸 것이다 (D71). 하단 고지가 그렇게 말한다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팀파이트 매니저 갤러리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/gallery.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: tabs('gallery')}"></div>

<div class="layout-wrap">
    <div class="main-col">
        <!--
          껍데기(.filters 패널)는 부르는 쪽이 그린다 — 조각은 라벨과 고르개만 낸다.
          carry 는 비어 있다: 커리어를 바꾸면 페이지는 0(가장 최근)으로 돌아가는 것이 맞고,
          batch 는 옛 커리어의 배치 번호라 들고 가면 남의 글을 열게 된다.
        -->
        <div class="filters">
            <div th:replace="~{fragments/filters :: slots('/gallery', ${slots}, ${selectedSlot}, ${carry})}"></div>
        </div>

        <div class="gallery-title">
            <h2>
                팀파이트 매니저 갤러리
                <span th:if="${gallery != null}"
                      th:text="'시즌 ' + ${gallery.season} + ' · ' + ${gallery.day} + '일차'">시점</span>
            </h2>
        </div>

        <main>
            <!--
              flash 메시지. POST /gallery/generate 가 리다이렉트하며 한 번만 실어 보낸 값이라
              새로고침하면 사라진다.
            -->
            <p class="notice" th:if="${notice}" th:text="${notice}">알림</p>

            <div class="action-bar">
                <div class="tournament-bar" th:if="${gallery != null}">
                    <span class="tour-badge">
                        <span class="league"
                              th:text="${gallery.blueTeamName} ?: ('팀 ' + ${gallery.blueTeamId})">블루</span>
                        <span class="stage"
                              th:text="${gallery.blueScore} + ' : ' + ${gallery.redScore}">스코어</span>
                        <span class="league"
                              th:text="${gallery.redTeamName} ?: ('팀 ' + ${gallery.redTeamId})">레드</span>
                    </span>
                    <!-- 기사는 있을 때만. 갤러리는 기사 없이도 선다 (D73) -->
                    <a class="tour-link" th:if="${gallery.articleId != null}"
                       th:href="@{'/story/' + ${gallery.articleId}}">이 경기 기사 →</a>
                </div>
                <div th:if="${gallery == null}" class="tournament-bar">
                    <span class="tour-badge"><span class="league">아직 갤러리가 없다</span></span>
                </div>

                <form th:if="${canGenerate and selectedSlot != null}"
                      method="post" th:action="@{/gallery/generate}" id="genForm">
                    <input type="hidden" name="slot" th:value="${selectedSlot}">
                    <button class="btn-refresh" type="submit" id="genBtn">🔄 반응 불러오기</button>
                </form>
            </div>

            <!--
              진행 막대. 생성은 요청 밖에서 돌기 때문에(StoryJobs) 이 화면이 몇 초마다
              /gallery/status 를 물어 단계를 갱신한다. 이게 없으면 1분 넘게 아무 신호가
              없고, 그건 사용자에게 "멈췄다" 와 구분되지 않는다 — 첫 실물이 그렇게 보였다.
            -->
            <div class="progress-box" id="progressBox" style="display:none;">
                <div class="progress-step" id="progressStep">시작하는 중…</div>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-note">
                    글 20편을 모델 호출 두 번으로 만든다. 분당 토큰 한도에 한 번쯤 걸려
                    1분 남짓 — 이 창을 닫아도 생성은 계속된다.
                </div>
            </div>

            <div class="sort-bar" id="sortBar" style="display:none;">
                <span class="sort-link active" id="sort-date" onclick="sortBoard('date')">최신순</span>
                <span class="sort-link" id="sort-views" onclick="sortBoard('views')">조회순</span>
                <span class="sort-link" id="sort-likes" onclick="sortBoard('likes')">추천순</span>
            </div>

            <!-- 좁은 화면에서 제목 칸이 0 이 되지 않게, 표가 자기 상자 안에서만 흐른다 -->
            <div class="board-scroll">
            <table class="board-list">
                <thead>
                <tr>
                    <th width="60">번호</th>
                    <th>제목</th>
                    <th width="130">글쓴이</th>
                    <th width="70">작성일</th>
                    <th width="55">조회</th>
                    <th width="50">추천</th>
                </tr>
                </thead>
                <tbody id="boardBody">
                <tr><td colspan="6" class="board-empty">아직 게시글이 없습니다.</td></tr>
                </tbody>
            </table>
            </div>

            <!--
              페이지 넘기기. 배치 하나가 페이지 하나다 — '반응 불러오기' 를 누를 때마다
              쌓인다(D72 결정 5). 0 이 가장 최근이다.
            -->
            <div class="pagination-container" th:if="${pageCount > 1}">
                <a th:each="i : ${#numbers.sequence(0, pageCount - 1)}"
                   class="page-btn"
                   th:classappend="${i == pageIndex} ? 'active' : ''"
                   th:href="@{/gallery(slot=${selectedSlot}, page=${i})}"
                   th:text="${i + 1}">1</a>
            </div>

            <!-- 글 하나. 목록 대신 이 자리가 뜬다 -->
            <div class="post-view" id="postView">
                <div style="margin-bottom: 12px;">
                    <button class="settings-btn" type="button" onclick="closePost()">◀ 목록으로</button>
                </div>
                <div class="post-view-header">
                    <h3 class="post-view-title" id="viewTitle"></h3>
                    <div class="post-view-info">
                        <div><span id="viewAuthor"></span> <span id="viewKind" class="kind-badge"></span></div>
                        <div><span id="viewDate"></span> · 조회 <span id="viewViews"></span></div>
                    </div>
                </div>
                <div class="attach-box" id="viewImage" style="display:none;"></div>
                <div class="post-view-content" id="viewContent"></div>

                <div class="recom-container">
                    <div class="recom-btn up">
                        <span class="label">추천</span><span class="num" id="viewLikes">0</span>
                    </div>
                </div>

                <div class="comment-section">
                    <h4>댓글 <span id="viewCmtCount">0</span>개</h4>
                    <div id="viewComments"></div>
                </div>
            </div>

            <p class="disclaimer">
                <b>이 게시판의 글·댓글·조회수·추천수는 전부 지어낸 것이다.</b>
                경기 결과와 선수 기록만 세이브 파일에서 왔다.
            </p>
        </main>
    </div>

<!--
  게시판 데이터. th:utext 로 넣는 이유는 <script> 안에서 HTML 엔티티가 해석되지 않기
  때문이다 — th:text 로 이스케이프하면 &quot; 가 글자 그대로 남아 JSON 파싱이 깨진다.
  대신 서버가 '<' 를 < 로 바꿔 보낸다(GalleryController.toJson): 값 안의
  </script> 가 여기서 스크립트를 끝내 버리는 것을 막는 유일한 장치다.
-->
<script type="application/json" id="boardData" th:utext="${boardJson}">null</script>

<script th:src="@{/js/gallery.js}"></script>
<script th:inline="javascript">
    // 서버가 아는 값만 넘긴다. 나머지는 gallery.js 가 위 JSON 에서 읽는다.
    startGallery({
        slot: /*[[${selectedSlot}]]*/ null,
        canGenerate: /*[[${canGenerate}]]*/ false
    });
</script>
</body>
</html>
