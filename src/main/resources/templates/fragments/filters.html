<!DOCTYPE html>
<!--
  거르개 조각 — 네 화면이 같은 모양의 커리어 칩을 쓴다.

  <b>내용이 없는 커리어도 칩으로 그린다.</b> 이게 이 조각이 생긴 이유다.
  전에는 연대기가 "기사가 있는 슬롯" 만, 갤러리가 "갤이 있는 슬롯" 만 목록에 넣었고,
  갤러리는 아예 칩이 없었다. 그러면 슬롯 2로 첫 기사를 쓰러 갈 길이 없다 —
  기사가 있어야 칩이 보이고 칩을 눌러야 기사가 생기는 순환이다.

  대신 비어 있다는 사실은 흐린 색과 제목말이 말한다. 목록에서 빼는 것과 흐리게
  그리는 것은 다르다: 빠지면 "없는 커리어" 이고, 흐리면 "아직 안 쓴 커리어" 다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!--
  @{${base}(slot=${s})} — base 는 문자열 변수다(예: '/story'). 링크식의 앞부분에
  식을 그대로 넣을 수 있어서 화면마다 다른 주소를 한 조각으로 쓸 수 있다.

  @param base     칩이 가리킬 경로. 예: '/story' · '/gallery'
  @param slots    적재된 커리어 전부. 내용 유무와 무관하다
  @param selected 지금 보고 있는 커리어. null 이면 아무것도 안 켜진다
  @param filled   내용이 있는 커리어의 집합. 여기 없으면 흐리게 그린다
-->
<div th:fragment="slots(base, slots, selected, filled)"
     class="filters" th:if="${slots != null and !slots.isEmpty()}">
    <span class="label">커리어</span>
    <a th:each="s : ${slots}"
       class="chip"
       th:href="@{${base}(slot=${s})}"
       th:text="'슬롯 ' + ${s}"
       th:title="${filled != null and filled.contains(s)} ? null : '아직 비어 있다'"
       th:classappend="${s == selected} ? 'on'
                       : (${filled != null and filled.contains(s)} ? '' : 'void')">슬롯 1</a>
</div>

</body>
</html>
